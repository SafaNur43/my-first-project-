<!DOCTYPE html>

    <header class="navbar">

        <a href="menu.html"></a>

<main>
    <section class="menu">
        <a href="index.html" class="back-home">Back to Home</a>
        <h2 class="section-heading">Our Menu</h2>

        <div class="menu-container">

            <!-- Pizza -->

            <div class="menu-card">
                <img src="assets/images/pexels-nadin-sh-78971847-15215605.jpg" alt="Margherita Pizza">

                 <h3>Margherita Pizza</h3>
                 <p>Tomato, mozzarella, fresh basel</p>

            <!-- Pasta -->

            <div class="menu-card">

            <div class="menu-card">
                <img src="assets/images/pexels-evgeniya-davydova-35773675-14766327.jpg" alt="Tiramisu">
